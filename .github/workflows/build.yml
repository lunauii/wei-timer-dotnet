name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # A Windows runner, not ubuntu-latest, because catching real Windows build
    # issues (not just cross-compile-from-Linux issues) is the whole point of
    # CI here -- this repo's dev machine can only ever compile, not run, WPF.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WeiTimer.sln

      - name: Build
        run: dotnet build WeiTimer.sln -c Release --no-restore
